<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CAT — Kitten Rescue</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
body{display:flex;justify-content:center;align-items:center}

canvas{width:100%;height:100%;display:block}

</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div class="hud"><div class="badge">😺 RESCUES <span id="score">0</span></div><div class="badge">🐾 KITTENS <span id="left">0</span></div><div class="badge">🐣 CHICKS <span id="chicksLeft">3</span></div><div class="badge">🌳 LEVEL <span id="level">1</span></div><div class="badge">⭐ BEST <span id="best">0</span></div></div>
<button id="mute">🔊</button>
<div id="overlay"><div class="card"><h1>🐱 CAT</h1><h2>Kitten Rescue</h2><p>Help the kittens get safely down from the tree!<br>Aim anywhere on the tree and tap to throw a tasty treat. Aim higher for a stronger throw!</p><button class="btn" id="start">RESCUE THE KITTENS</button><div class="small">🍪 Treats • 😺 Meows • 🌳 Branches • ❤️ Happy reunions</div></div></div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),game=document.getElementById('game');
let W,H,dpr,score=0,best=+localStorage.catBest||0,running=false,muted=false,aimX=.5,aimY=.5,treats=[],kittens=[],birds=[],chicks=[],particles=[],mother={x:.5,y:.89},last=0,audioCtx=null,level=1,levelBanner=0,hatchTimer=0,hatchedChicks=0,eatenChicks=0;
const foliage=Array.from({length:34},(_,i)=>({x:.04+((i*37)%92)/100,y:.08+((i*53)%45)/100,r:18+(i*11)%25,s:i%2?1:-1}));
const frontLeaves=[
 {x:.22,y:.34,r:28},{x:.70,y:.35,r:30},{x:.34,y:.48,r:25},{x:.65,y:.50,r:27},
 {x:.18,y:.58,r:28},{x:.76,y:.58,r:25},{x:.38,y:.67,r:24},{x:.68,y:.68,r:27}
];

document.getElementById('best').textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=game.clientWidth;H=game.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let branches=[];
let treeTrunk={base:.50,mid:.49,upper:.52,top:.54,width:.18};
let nest={x:.61,y:.205};
const treeProfiles=[
 {trunk:{base:.50,mid:.49,upper:.52,top:.54,width:.18},nest:{x:.61,y:.205},branches:[
  {x:.12,y:.24,len:.62,a:.05},{x:.20,y:.38,len:.67,a:-.12},{x:.08,y:.52,len:.72,a:.08},{x:.27,y:.65,len:.57,a:-.06},{x:.10,y:.76,len:.78,a:.04}]},
 {trunk:{base:.50,mid:.51,upper:.48,top:.46,width:.19},nest:{x:.39,y:.20},branches:[
  {x:.04,y:.22,len:.67,a:.10},{x:.23,y:.35,len:.58,a:-.16},{x:.08,y:.49,len:.72,a:.03},{x:.30,y:.64,len:.54,a:.11},{x:.13,y:.75,len:.70,a:-.08}]},
 {trunk:{base:.49,mid:.47,upper:.50,top:.56,width:.18},nest:{x:.66,y:.18},branches:[
  {x:.15,y:.22,len:.60,a:-.12},{x:.03,y:.37,len:.72,a:.09},{x:.24,y:.50,len:.61,a:-.18},{x:.05,y:.64,len:.74,a:.05},{x:.31,y:.76,len:.53,a:.13}]},
 {trunk:{base:.50,mid:.53,upper:.55,top:.51,width:.20},nest:{x:.57,y:.205},branches:[
  {x:.10,y:.25,len:.76,a:.06},{x:.24,y:.39,len:.62,a:.15},{x:.02,y:.52,len:.70,a:-.09},{x:.28,y:.65,len:.55,a:-.14},{x:.12,y:.76,len:.76,a:.07}]},
 {trunk:{base:.50,mid:.46,upper:.44,top:.49,width:.17},nest:{x:.46,y:.19},branches:[
  {x:.07,y:.23,len:.70,a:-.08},{x:.18,y:.36,len:.73,a:.07},{x:.04,y:.51,len:.65,a:.17},{x:.25,y:.63,len:.67,a:-.06},{x:.16,y:.76,len:.70,a:-.12}]},
 {trunk:{base:.50,mid:.54,upper:.50,top:.45,width:.19},nest:{x:.58,y:.18},branches:[
  {x:.02,y:.21,len:.76,a:.12},{x:.27,y:.34,len:.58,a:-.12},{x:.06,y:.48,len:.78,a:.05},{x:.32,y:.62,len:.49,a:.18},{x:.08,y:.76,len:.79,a:-.05}]}
];
function setTreeShape(){
 const p=treeProfiles[(level-1)%treeProfiles.length];
 treeTrunk={...p.trunk};
 nest={...p.nest};
 branches=p.branches.map(b=>({...b}));
}
function bx(b,t){return b.x+b.len*t}
function by(b,t){return b.y+b.len*t*Math.tan(b.a)}
function spawn(){kittens=[];let n=7;for(let i=0;i<n;i++){let bi=i%branches.length,t=.16+Math.random()*.7;kittens.push({b:bi,t,dir:Math.random()<.5?-1:1,s:24+Math.random()*5,fall:false,x:0,y:0,vy:0,phase:Math.random()*6,happy:false,jump:null,jumpTimer:4+Math.random()*6,color:['#f5b56b','#fff','#777','#d98d65','#f3d18b'][i%5]})}updateCount()}
function startJump(k){
 let toB=Math.floor(Math.random()*branches.length);
 while(toB===k.b)toB=Math.floor(Math.random()*branches.length);
 k.jump={fromB:k.b,fromT:k.t,toB,toT:.12+Math.random()*.76,p:0,dur:.65+Math.random()*.3,arc:22+Math.random()*18};
}
function spawnBirds(){birds=[];let count=Math.min(3+level-1,8);for(let i=0;i<count;i++){birds.push({x:-60-i*140,y:H*(.14+Math.random()*.50),vx:2.2+Math.random()*.9+level*.12,s:1+Math.random()*.25,phase:Math.random()*6})}}
function respawnKitten(){let i=kittens.length,b,t;do{b=Math.floor(Math.random()*branches.length);t=.15+Math.random()*.7;let px=bx(branches[b],t),py=by(branches[b],t);if(Math.hypot(px-nest.x,py-nest.y)>.42)break}while(true);kittens.push({b,t,dir:Math.random()<.5?-1:1,s:24+Math.random()*5,fall:false,x:0,y:0,vy:0,phase:Math.random()*6,happy:false,jump:null,jumpTimer:4+Math.random()*6,color:['#f5b56b','#fff','#777','#d98d65','#f3d18b'][i%5]});updateCount()}
const hatchTimes=[8,16,24];
function resetNest(){chicks=[];hatchTimer=0;hatchedChicks=0;eatenChicks=0}
function spawnChick(){
 const i=hatchedChicks++;
 const targets=[{b:0,t:.72},{b:1,t:.56},{b:2,t:.42}];
 const target=targets[i%targets.length];
 chicks.push({b:target.b,t:target.t,dir:i%2?-1:1,s:15,phase:Math.random()*6,entry:.9,x:nest.x*W,y:nest.y*H});
 sound('tweet');
 particles.push({x:nest.x*W,y:(nest.y-.03)*H,vx:0,vy:-.3,life:1,t:'🐣'});
}
function gameOver(){
 running=false;
 if(score>best){best=score;localStorage.catBest=best;document.getElementById('best').textContent=best;localStorage.catBest=best}
 document.querySelector('.card h1').textContent='😿 OH NO!';
 document.querySelector('.card h2').textContent='All 3 chicks were eaten!';
 document.querySelector('.card p').innerHTML='The kittens caught all three chicks.<br><b>Score: '+score+'</b>';
 document.getElementById('start').textContent='TRY AGAIN';
 document.getElementById('overlay').style.display='flex';
}
function updateCount(){document.getElementById('left').textContent=kittens.filter(k=>!k.happy).length;document.getElementById('level').textContent=level;document.getElementById('chicksLeft').textContent=3-eatenChicks}
function sound(type){
if(muted)return;
try{
  const A=window.AudioContext||window.webkitAudioContext;
  if(!audioCtx)audioCtx=new A();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const t=audioCtx.currentTime;
  if(type==='tweet'){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='square';o.frequency.setValueAtTime(950,t);o.frequency.exponentialRampToValueAtTime(1500,t+.07);o.frequency.exponentialRampToValueAtTime(900,t+.16);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.21);return;}
  if(type==='hit'){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type='triangle';
    o.frequency.setValueAtTime(720,t);
    o.frequency.exponentialRampToValueAtTime(390,t+.28);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.10,t+.025);
    g.gain.exponentialRampToValueAtTime(.001,t+.32);
    o.start(t);o.stop(t+.34);
    return;
  }
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  const f=type==='meow'?420:700;
  o.frequency.value=f;o.type='sine';
  g.gain.setValueAtTime(.06,t);
  g.gain.exponentialRampToValueAtTime(.001,t+.16);
  o.start(t);o.stop(t+.17);
}catch(e){}
}
function start(){score=0;level=1;setTreeShape();treats=[];particles=[];resetNest();spawn();spawnBirds();updateCount();running=true;document.getElementById('overlay').style.display='none';last=performance.now();requestAnimationFrame(loop);sound('throw')}
function finish(){running=false;if(score>best){best=score;localStorage.catBest=best;document.getElementById('best').textContent=best}document.querySelector('.card h1').textContent='😻 WELL DONE!';document.querySelector('.card h2').textContent='All kittens are safe!';document.querySelector('.card p').innerHTML='Mother Cat has all her kittens back.<br><b>Rescues: '+score+'</b>';document.getElementById('start').textContent='PLAY AGAIN';document.getElementById('overlay').style.display='flex'}
function throwTreat(){if(!running)return;let x=aimX*W;let lift=12+Math.max(0,(.88-aimY))*12;treats.push({x,y:H*.88,vx:(x-W*.5)*.015,vy:-lift,r:9});sound('throw')}
function update(dt){
hatchTimer+=dt/60;
if(hatchedChicks<hatchTimes.length&&hatchTimer>=hatchTimes[hatchedChicks])spawnChick();
for(const ch of chicks){
 if(ch.entry>0){
   ch.entry-=.035*dt;
   let p=1-Math.max(0,ch.entry);
   let tx=bx(branches[ch.b],ch.t)*W,ty=by(branches[ch.b],ch.t)*H;
   ch.x=nest.x*W+(tx-nest.x*W)*p;
   ch.y=nest.y*H+(ty-nest.y*H)*p;
 }else{
   ch.t+=ch.dir*(.0011*(1+(level-1)*.18))*dt;
   if(ch.t<.08||ch.t>.92)ch.dir*=-1;
   ch.x=bx(branches[ch.b],ch.t)*W;
   ch.y=by(branches[ch.b],ch.t)*H;
   ch.phase+=.08*dt;
 }
}
for(const b of birds){b.x+=b.vx*dt;b.phase+=.12*dt;if(b.x>W+80){b.x=-80-Math.random()*140;b.y=H*(.14+Math.random()*.50);b.vx=2.2+Math.random()*.9+level*.12}}
for(const k of kittens){if(k.happy)continue;if(k.fall){k.vy+=.38*dt;k.y+=k.vy*dt;if(k.y>H*.86){k.happy=true;k.x=mother.x*W+(Math.random()-.5)*25;k.y=H*.84;score+=100;for(let j=0;j<12;j++)particles.push({x:k.x,y:k.y,vx:(Math.random()-.5)*5,vy:-Math.random()*5,life:1,t:'❤'});sound('meow')}}else if(k.jump){k.jump.p+=dt/(16.67*k.jump.dur);let p=Math.min(1,k.jump.p),from=branches[k.jump.fromB],to=branches[k.jump.toB];k.x=(bx(from,k.jump.fromT)+(bx(to,k.jump.toT)-bx(from,k.jump.fromT))*p)*W;k.y=(by(from,k.jump.fromT)+(by(to,k.jump.toT)-by(from,k.jump.fromT))*p)*H-Math.sin(Math.PI*p)*k.jump.arc;k.phase+=.12*dt;if(p>=1){k.b=k.jump.toB;k.t=k.jump.toT;k.jump=null;k.jumpTimer=Math.max(1.5,7.5-level*.45);}}else{k.t+=k.dir*(.0009*(1+(level-1)*.35))*dt;if(k.t<.08||k.t>.92){k.dir*=-1;sound(Math.random()<.25?'hiss':'meow')}k.jumpTimer-=dt/60;if(k.jumpTimer<=0&&level>=1){if(Math.random()<Math.min(.65,.12+level*.09)){startJump(k);particles.push({x:k.x,y:k.y-18,vx:0,vy:-.5,life:1,t:'BOING!'})}k.jumpTimer=Math.max(1.5,8-level*.5)+Math.random()*3}k.x=bx(branches[k.b],k.t)*W;k.y=by(branches[k.b],k.t)*H;k.phase+=.06*dt}}
for(const k of kittens){
 if(k.happy||k.fall)continue;
 for(let ci=chicks.length-1;ci>=0;ci--){
   const ch=chicks[ci];
   if(ch.entry>0)continue;
   if(Math.hypot(k.x-ch.x,k.y-ch.y)<k.s+ch.s){
     chicks.splice(ci,1);
     eatenChicks++;
     score=Math.max(0,score-100);
     particles.push({x:ch.x,y:ch.y-16,vx:.2,vy:-.5,life:1,t:'CHICK!'});
     particles.push({x:ch.x,y:ch.y+10,vx:0,vy:-.3,life:1,t:'😿'});
     sound('tweet');
     if(eatenChicks>=3){gameOver();return}
     break;
   }
 }
}
for(let i=treats.length-1;i>=0;i--){let q=treats[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.22*dt;let blockedByBird=false;for(const b of birds){if(Math.hypot(q.x-b.x,q.y-b.y)<24*b.s){blockedByBird=true;respawnKitten();sound('tweet');particles.push({x:b.x,y:b.y-18,vx:.3,vy:-.4,life:1,t:'TWEET!'});particles.push({x:b.x+8,y:b.y+12,vx:.2,vy:.3,life:1,t:'+1 KITTEN!'});break}}if(blockedByBird){treats.splice(i,1);continue}for(const k of kittens){if(k.fall||k.happy)continue;if(Math.hypot(q.x-k.x,q.y-k.y)<k.s+q.r){k.fall=true;k.vy=-5;score+=25;for(let j=0;j<8;j++)particles.push({x:k.x,y:k.y,vx:(Math.random()-.5)*4,vy:-Math.random()*4,life:1,t:'🍪'});particles.push({x:k.x+10,y:k.y-24,vx:.25,vy:-.5,life:1,t:'MEOW!'});sound('hit');q.y=-100;break}}if(q.y<-50||q.y>H+50)treats.splice(i,1)}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.12*dt;p.life-=.025*dt;if(p.life<=0)particles.splice(i,1)}
updateCount();if(score>best){best=score;localStorage.catBest=best;document.getElementById('best').textContent=best}if(levelBanner>0)levelBanner-=.02*dt;if(kittens.every(k=>k.happy)){level++;score+=250*level;setTreeShape();resetNest();spawn();spawnBirds();levelBanner=1.8}}
function drawTree(){
const tr=treeTrunk;
ctx.fillStyle='#5b351f';
ctx.beginPath();
ctx.moveTo((tr.base-tr.width/2)*W,H);
ctx.quadraticCurveTo((tr.mid-tr.width*.54)*W,H*.80,(tr.upper-tr.width*.46)*W,H*.54);
ctx.quadraticCurveTo((tr.top-tr.width*.32)*W,H*.36,tr.top*W,H*.29);
ctx.quadraticCurveTo((tr.top+tr.width*.32)*W,H*.36,(tr.upper+tr.width*.46)*W,H*.54);
ctx.quadraticCurveTo((tr.mid+tr.width*.54)*W,H*.80,(tr.base+tr.width/2)*W,H);
ctx.closePath();ctx.fill();
ctx.fillStyle='#704327';
ctx.beginPath();
ctx.moveTo((tr.base-tr.width*.32)*W,H);
ctx.quadraticCurveTo((tr.mid-tr.width*.38)*W,H*.79,(tr.upper-tr.width*.30)*W,H*.53);
ctx.quadraticCurveTo((tr.top-tr.width*.20)*W,H*.37,tr.top*W,H*.31);
ctx.quadraticCurveTo((tr.top+tr.width*.20)*W,H*.37,(tr.upper+tr.width*.30)*W,H*.53);
ctx.quadraticCurveTo((tr.mid+tr.width*.38)*W,H*.79,(tr.base+tr.width*.32)*W,H);
ctx.closePath();ctx.fill();
ctx.fillStyle='#8d5833';
ctx.beginPath();
ctx.moveTo((tr.base-tr.width*.12)*W,H);
ctx.quadraticCurveTo((tr.mid-tr.width*.18)*W,H*.78,(tr.upper-tr.width*.13)*W,H*.53);
ctx.quadraticCurveTo((tr.top-tr.width*.09)*W,H*.37,tr.top*W,H*.32);
ctx.quadraticCurveTo((tr.top+tr.width*.09)*W,H*.37,(tr.upper+tr.width*.13)*W,H*.53);
ctx.quadraticCurveTo((tr.mid+tr.width*.18)*W,H*.78,(tr.base+tr.width*.12)*W,H);
ctx.closePath();ctx.fill();ctx.strokeStyle='#573a24';ctx.lineWidth=2;for(let i=0;i<11;i++){let y=.48+i*.045+((level+i)%3)*.004;let cx=treeTrunk.mid+(treeTrunk.upper-treeTrunk.mid)*(1-(y-.48)/.30);ctx.beginPath();ctx.moveTo((cx-.035)*W,y*H);ctx.quadraticCurveTo(cx*W,(y-.008)*H,(cx+.028)*W,(y+.004)*H);ctx.stroke();}for(const b of branches){let x1=b.x*W,y1=b.y*H,x2=(b.x+b.len)*W,y2=(b.y+b.len*Math.tan(b.a))*H;ctx.strokeStyle='#774527';ctx.lineWidth=25;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.strokeStyle='#a9683c';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(x1,y1-3);ctx.lineTo(x2,y2-3);ctx.stroke()}ctx.fillStyle='#3f8f49';for(const f of foliage){ctx.globalAlpha=.88;ctx.beginPath();ctx.arc(f.x*W,f.y*H,f.r,0,7);ctx.fill();ctx.fillStyle='#66a955';ctx.beginPath();ctx.arc((f.x-.012*f.s)*W,(f.y-.012)*H,f.r*.58,0,7);ctx.fill();ctx.fillStyle='#3f8f49'}ctx.globalAlpha=1;}
function drawFrontLeaves(){for(const f of frontLeaves){ctx.globalAlpha=.96;ctx.fillStyle='#2f763d';ctx.beginPath();ctx.arc(f.x*W,f.y*H,f.r,0,7);ctx.fill();ctx.fillStyle='#63a957';ctx.beginPath();ctx.arc((f.x-.018)*W,(f.y-.018)*H,f.r*.58,0,7);ctx.fill()}ctx.globalAlpha=1;}

function cat(x,y,color,scale=1,happy=false){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,4,18,15,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-14,-7);ctx.lineTo(-11,-25);ctx.lineTo(-3,-13);ctx.moveTo(14,-7);ctx.lineTo(11,-25);ctx.lineTo(3,-13);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-6,-3,2.5,0,7);ctx.arc(6,-3,2.5,0,7);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,2,4,0,Math.PI);ctx.stroke();if(happy){ctx.fillStyle='#ffb4cf';ctx.font='20px sans-serif';ctx.fillText('♥',20,-15)}ctx.restore()}
function drawNest(){
 ctx.save();ctx.translate(nest.x*W,nest.y*H);
 ctx.lineCap='round';ctx.strokeStyle='#583b24';ctx.lineWidth=5;
 for(let i=0;i<9;i++){let a=-.8+i*.2;ctx.beginPath();ctx.moveTo(-22+i*5,9);ctx.quadraticCurveTo(Math.cos(a)*28,16+Math.sin(i)*3,Math.cos(a)*22,2);ctx.stroke()}
 ctx.fillStyle='#70502f';ctx.beginPath();ctx.ellipse(0,8,27,11,0,0,7);ctx.fill();
 for(let i=0;i<3;i++){
   if(i<hatchedChicks)continue;
   let crack=hatchTimer/hatchTimes[i];
   let wobble=crack>.72?Math.sin(hatchTimer*10+i)*2:0;
   ctx.save();ctx.translate((-12+i*12)+wobble,-1);ctx.rotate((i-1)*.08);
   ctx.fillStyle='#f4e7bf';ctx.beginPath();ctx.ellipse(0,0,7,9,0,0,7);ctx.fill();
   if(crack>.72&&crack<1.15){ctx.strokeStyle='#8b6b43';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-3,-3);ctx.lineTo(1,0);ctx.lineTo(-1,3);ctx.lineTo(3,5);ctx.stroke()}
   ctx.restore();
 }
 ctx.restore();
}
function chick(x,y,s,phase){
 ctx.save();ctx.translate(x,y);ctx.scale(s/15,s/15);
 ctx.fillStyle='#e8c85b';ctx.beginPath();ctx.ellipse(0,3,11,9,0,0,7);ctx.fill();
 ctx.fillStyle='#f6df77';ctx.beginPath();ctx.arc(-2,-4,8,0,7);ctx.fill();
 ctx.fillStyle='#f0a73b';ctx.beginPath();ctx.moveTo(6,-3);ctx.lineTo(13,0);ctx.lineTo(6,2);ctx.fill();

}
function bird(x,y,s,phase){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle='#29333a';ctx.fillStyle='#4b5961';ctx.lineWidth=3;ctx.lineCap='round';let w=Math.sin(phase)*7;ctx.beginPath();ctx.moveTo(-5,0);ctx.quadraticCurveTo(-18,-11-w,-30,-2);ctx.moveTo(5,0);ctx.quadraticCurveTo(18,-11-w,30,-2);ctx.stroke();ctx.beginPath();ctx.ellipse(0,4,8,5,0,0,7);ctx.fill();ctx.fillStyle='#f3b53f';ctx.beginPath();ctx.moveTo(7,3);ctx.lineTo(16,6);ctx.lineTo(7,8);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(4,2,2,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(4,2,1,0,7);ctx.fill();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);drawTree();drawNest();ctx.fillStyle='#356d35';ctx.fillRect(0,H*.9,W,H*.1);for(const b of birds)bird(b.x,b.y,b.s,b.phase);for(const ch of chicks)chick(ch.x,ch.y,ch.s,ch.phase);cat(mother.x*W,H*.86,'#d28b4c',1.35,true);for(const k of kittens){if(!k.happy)cat(k.x,k.y,k.color,.9+Math.sin(k.phase)*.03)}drawFrontLeaves();for(const q of treats){ctx.fillStyle='#d58a39';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();ctx.fillStyle='#fff2b5';ctx.beginPath();ctx.arc(q.x-2,q.y-2,2,0,7);ctx.fill()}ctx.fillStyle='white';ctx.font='22px sans-serif';for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillText(p.t,p.x,p.y)}ctx.globalAlpha=1;ctx.fillStyle='#ffffff99';ctx.fillRect(0,H*.89,W,3);ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('👆 AIM ANYWHERE  •  TAP TO THROW A TREAT',W/2,H-18);if(levelBanner>0){ctx.globalAlpha=Math.min(1,levelBanner);ctx.font='900 42px system-ui';ctx.fillStyle='#fff';ctx.strokeStyle='#5b351f';ctx.lineWidth=6;ctx.strokeText('LEVEL '+level,W/2,H*.18);ctx.fillText('LEVEL '+level,W/2,H*.18);ctx.globalAlpha=1}}
function loop(t){if(!running)return;let dt=Math.min(2,(t-last)/16.67);last=t;update(dt);draw();requestAnimationFrame(loop)}
game.addEventListener('pointermove',e=>{if(e.target.closest('button'))return;aimX=Math.max(.08,Math.min(.92,e.offsetX/W));aimY=Math.max(.08,Math.min(.88,e.offsetY/H));});
game.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;aimX=Math.max(.08,Math.min(.92,e.offsetX/W));aimY=Math.max(.08,Math.min(.88,e.offsetY/H));throwTreat()});
document.getElementById('start').onclick=start;document.getElementById('mute').onclick=()=>{muted=!muted;document.getElementById('mute').textContent=muted?'🔇':'🔊'};
draw();
